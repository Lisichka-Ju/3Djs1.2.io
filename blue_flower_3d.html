<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Point Flower Animation (Three.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<!-- Подключаем Three.js и OrbitControls через CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<script>
    // Класс цветка из вашего кода
    class PointFlower extends THREE.Points {
        constructor(amount = 50000) {
            const petalAmount = 51;
            const basePetal = THREE.BufferGeometryUtils.mergeGeometries([
                new THREE.RingGeometry(1, 0.75, 64, 4),
                new THREE.RingGeometry(0.5, 0.3, 64, 4),
                new THREE.PlaneGeometry(0.2, 2, 1, 20),
            ]);
            basePetal.translate(0, 1, 0).scale(0.5, 1, 1);
            
            const petalGeometry = (w, h, flatRatio) => {
                const g = basePetal.clone();
                const pos = g.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const xVal = pos.getX(i);
                    const zVal = (1 - Math.sqrt(1 - THREE.MathUtils.clamp(xVal / 0.5)));
                    const yVal = pos.getY(i);
                }
                return g.scale(w, h, 1);
            };

            // Создаем геометрию точек для цветка
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            
            for (let i = 0; i < amount; i++) {
                const u = Math.random();
                const theta = i * 2.4; // Золотой угол для спиралей
                const r = Math.sqrt(u) * 5;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                const y = (Math.sin(r * 2) * 0.5) - (u * 2);
                positions.push(x, y, z);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            // Материал для светящихся неоново-синих точек
            const material = new THREE.PointsMaterial({
                color: 0x00bfff,
                size: 0.05,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            super(geometry, material);
        }
    }

    // Инициализация сцены Three.js
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Добавляем цветок на сцену
    const flower = new PointFlower(50000);
    scene.add(flower);

    // Анимация вращения
    function animate() {
        requestAnimationFrame(animate);
        flower.rotation.y += 0.003;
        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    // Адаптация под размер окна
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
