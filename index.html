<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Синий Цветок из точек (Three.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="info">Удерживайте левую кнопку мыши для вращения камеры</div>

<!-- Используем Import Maps для гарантированной и правильной загрузки Three.js и его дополнений -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

    // Класс цветка на основе вашего скриншота
    class PointFlower extends THREE.Points {
        constructor(amount = 50000) {
            const petalAmount = 51;

            // Базовый лепесток из объединенных геометрий
            const basePetal = BufferGeometryUtils.mergeGeometries([
                new THREE.RingGeometry(1, 0.75, 64, 4),
                new THREE.RingGeometry(0.5, 0.3, 64, 4),
                new THREE.PlaneGeometry(0.2, 2, 1, 20),
            ]);
            basePetal.translate(0, 1, 0).scale(0.5, 1, 1);

            // Функция деформации и масштабирования лепестка
            const petalGeometry = (w, h, flatRatio) => {
                const g = basePetal.clone();
                const pos = g.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const xVal = pos.getX(i);
                    // Деформация по оси Z для придания лепестку округлой формы чаши
                    const zVal = (1 - Math.sqrt(1 - THREE.MathUtils.clamp(Math.abs(xVal) / 0.5, 0, 1))) * flatRatio;
                    pos.setZ(i, zVal);
                }
                pos.needsUpdate = true;
                return g.scale(w, h, 1);
            };

            // Массив для объединения всех лепестков цветка
            const petals = [];

            // Создаем многослойные лепестки по кругу
            for (let i = 0; i < petalAmount; i++) {
                const ratio = i / petalAmount;
                const angle = ratio * Math.PI * 2;
                
                // Чередуем размеры лепестков для естественности
                const w = 0.8 + Math.sin(ratio * Math.PI * 5) * 0.2;
                const h = 2.5 - ratio * 1.2;
                const flatRatio = 0.5 + ratio * 0.5;

                const pg = petalGeometry(w, h, flatRatio);

                // Наклоняем лепесток наружу
                const tilt = 0.2 + ratio * 0.8; 
                pg.rotateX(tilt);

                // Смещаем и поворачиваем вокруг центра цветка
                pg.translate(0, 0, 0.3 + ratio * 0.5);
                pg.rotateY(angle);

                petals.push(pg);
            }

            // Объединяем все лепестки в одну геометрию
            const flowerGeometry = BufferGeometryUtils.mergeGeometries(petals);

            // Создаем светящийся неоново-синий материал точек
            const material = new THREE.PointsMaterial({
                color: 0x00d2ff,          // Голубой неон
                size: 0.045,              // Размер точек
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending, // Эффект свечения при наложении
                depthWrite: false
            });

            super(flowerGeometry, material);
        }
    }

    // Инициализация сцены, камеры и рендерера
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Ограничение камеры снизу

    // Создаем и добавляем синий цветок на сцену
    const flower = new PointFlower();
    scene.add(flower);

    // Добавим поле волнистых частиц вокруг цветка (как на скриншотах)
    const particleCount = 25000;
    const particlesGeom = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const colorCenter = new THREE.Color(0x00ffff); // Голубой центр
    const colorEdge = new THREE.Color(0x0033aa);   // Темно-синий край

    for (let i = 0; i < particleCount; i++) {
        // Распределяем частицы по кругу (диску)
        const angle = Math.random() * Math.PI * 2;
        const radius = 2 + Math.pow(Math.random(), 1.5) * 12; // Более плотно к центру

        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = -1.5; // Чуть ниже цветка

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // Расчет градиента цвета
        const ratio = radius / 14;
        const c = colorCenter.clone().lerp(colorEdge, ratio);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
    }

    particlesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particlesGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particlesMaterial = new THREE.PointsMaterial({
        size: 0.035,
        vertexColors: true,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const particleField = new THREE.Points(particlesGeom, particlesMaterial);
    scene.add(particleField);

    // Анимационный цикл
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();

        // Медленное вращение цветка и поля частиц
        flower.rotation.y = elapsedTime * 0.15;
        particleField.rotation.y = elapsedTime * 0.08;

        // Создаем волнообразное движение (анимацию волн на поле частиц)
        const posAttr = particleField.geometry.attributes.position;
        for (let i = 0; i < particleCount; i++) {
            const x = posAttr.getX(i);
            const z = posAttr.getZ(i);
            
            // Формула волны на основе расстояния от центра и времени
            const dist = Math.sqrt(x*x + z*z);
            const wave = Math.sin(dist * 0.8 - elapsedTime * 2.0) * 0.35 * (1.5 / (dist + 0.5));
            
            posAttr.setY(i, -1.8 + wave);
        }
        posAttr.needsUpdate = true;

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    // Обработчик изменения размеров окна браузера
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
