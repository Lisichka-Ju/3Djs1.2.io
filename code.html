<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Blue Point Flower Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<!-- Подключение библиотек Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<script>
    // Класс цветка из вашего скриншота
    class PointFlower extends THREE.Points {
        constructor(amount = 50000) {
            const petalAmount = 51;
            const basePetal = THREE.BufferGeometryUtils.mergeGeometries([
                new THREE.RingGeometry(1, 0.75, 64, 4),
                new THREE.RingGeometry(0.5, 0.3, 64, 4),
                new THREE.PlaneGeometry(0.2, 2, 1, 20),
            ]);
            basePetal.translate(0, 1, 0).scale(0.5, 1, 1);

            const petalGeometry = (w, h, flatRatio) => {
                const g = basePetal.clone();
                const pos = g.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const xVal = pos.getX(i);
                    const zVal = (1 - Math.sqrt(1 - THREE.MathUtils.clamp(xVal / 0.5)));
                    const yVal = pos.getY(i);
                }
                return g.scale(w, h, 1);
            };

            // Генерация точек для лепестков и поля частиц
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];

            const colorCenter = new THREE.Color(0x88ffff); // Ярко-голубой центр
            const colorEdge = new THREE.Color(0x0044ff);   // Синие края

            for (let i = 0; i < amount; i++) {
                const u = Math.random();
                const theta = i * 2.39996; // Спираль Фибоначчи
                const r = Math.sqrt(u) * 6;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                
                // Формирование чаши цветка
                const y = Math.pow(r / 2, 2) * 0.3 - Math.sin(r * 2) * 0.2 - 1;

                positions.push(x, y, z);

                // Градиент цвета от центра к краям
                const mixedColor = colorCenter.clone().lerp(colorEdge, r / 6);
                colors.push(mixedColor.r, mixedColor.g, mixedColor.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            // Материал точек со свечением
            const material = new THREE.PointsMaterial({
                size: 0.06,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            super(geometry, material);
        }
    }

    // Настройка сцены
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Добавляем объект цветка
    const flower = new PointFlower(60000);
    scene.add(flower);

    // Цикл анимации
    function animate() {
        requestAnimationFrame(animate);
        flower.rotation.y += 0.002;
        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    // Ресайз при изменении размера окна
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
